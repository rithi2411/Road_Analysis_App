<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Road Scan — Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    #map { height: 420px; border-radius: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>📊 Road Quality Dashboard</h1>
    <p class="sub">Aggregated readings from all devices • <a href="/">Record a trip</a></p>
  </header>

  <main>
    <section class="card">
      <div class="legend">
        <span class="dot" style="background:#22c55e"></span> smooth
        <span class="dot" style="background:#eab308"></span> fair
        <span class="dot" style="background:#f97316"></span> poor
        <span class="dot" style="background:#ef4444"></span> very bad
      </div>
      <div id="map"></div>
    </section>

    <section class="card">
      <h2>Worst road segments</h2>
      <table id="segTable">
        <thead><tr>
        <th>Road</th><th>Location</th><th>Avg score</th><th>Quality</th><th>Readings</th>
        <th>Devices</th><th>Confidence</th><th></th>
      </tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Reports filed</h2>
      <div id="reportsList" class="muted">No reports filed yet.</div>
    </section>
  </main>

  <dialog id="reportDlg">
    <h3>Report road to municipality</h3>
    <p id="dlgInfo" class="muted"></p>
    <label>Note for the report<br/>
      <textarea id="dlgNote" rows="3" placeholder="e.g. large potholes near the school gate"></textarea>
    </label>
    <label>Contact (optional)<br/>
      <input id="dlgContact" placeholder="email / phone" />
    </label>
    <div class="dlg-actions">
      <button id="dlgCancel">Cancel</button>
      <button id="dlgFile" class="primary">📩 File report</button>
    </div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
