# Render Blueprint — https://render.com/docs/blueprints
# Deploy: go to render.com → New → Blueprint → paste this repo URL.
# Everything runs 24/7 with free auto-HTTPS and auto-deploys on git push.

services:
  - type: web
    name: road-analysis
    env: node
    region: singapore          # closest to your users (Asia/Calcutta)
    plan: free                 # free tier
    buildCommand: npm install
    startCommand: npm start    # → node server.js
    autoDeploy: true           # deploy on every push to main/master

    envVars:
      - key: PORT
        value: "3000"

      # ── Supabase persistence ───────────────────────────────────────────────
      # Create a free project at https://supabase.com, then run the SQL in
      # supabase_setup.sql (in this repo) to create the two tables.
      # Paste your project values below (or set them as Render env secrets).
      - key: SUPABASE_URL
        value: "https://YOUR_PROJECT_ID.supabase.co"   # ← replace
      - key: SUPABASE_ANON_KEY
        value: "YOUR_ANON_KEY_HERE"                     # ← replace
